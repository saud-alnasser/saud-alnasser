name: '🔧 integration'

# `edited` is deliberately absent. It fires on a title or body change, and the
# only check that cares about either has its own workflow — see
# pull-request-title.yml.
on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

# A pull request only ever needs an answer about its newest commit. Without this,
# pushing again while a run is in flight leaves both running, and the older one
# spends a full run reporting on a commit nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # A default-branch ruleset requiring a status check names this job. Renaming
  # it, or moving it off a trigger that fires for every commit, makes every pull
  # request unmergeable once that ruleset exists.
  integration:
    # Lighthouse alone runs twelve audits, which takes about two minutes on
    # a runner, and the content test builds the site twice more.
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      # The whole history, because the identifier scan below reads every
      # commit on every branch; a shallow clone would scan only the newest.
      - name: '☁️ checkout repository'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: '🔧 setup node'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # A generated index is never hand-edited, and this is what enforces it: the
      # regeneration overwrites the index, so anything git still reports afterwards —
      # a stale index, a hand edit, a drifted generator — fails the run, named. Needs
      # node and nothing else, which is why it runs before anything is installed.
      - name: '🗺️ verify generated indexes'
        run: |
          node .aep/scripts/index.mjs > /dev/null
          stale=$(git status --porcelain -- .aep/index.md | cut -c4-)
          if [ -n "$stale" ]; then
            echo 'stale generated index — regenerate with: node .aep/scripts/index.mjs' >&2
            printf '%s\n' "$stale"
            exit 1
          fi
          node .aep/scripts/validate.mjs --quiet

      # The site. The pnpm version comes from the `packageManager` field in
      # package.json. After the install: the history scan, the type check, the
      # build, the CV PDFs, then every gate over the built output in turn: the
      # dist checks, the browser tests, Lighthouse, and the content mechanism
      # test, which rebuilds the site with a fixture and so runs last. The
      # deploy is its own workflow, deploy.yml, on `push` to `main`; it does
      # not repeat the gates, it deploys what this workflow already judged.
      - name: '🔧 setup pnpm'
        uses: pnpm/action-setup@v6

      - name: '📦 install dependencies'
        run: pnpm install --frozen-lockfile

      # No identifier in any commit on any branch. Needs only git and the full
      # history fetched above, so it runs before anything is built.
      - name: '🔒 scan the history for identifiers'
        run: pnpm scan:history

      - name: '🔍 check the site'
        run: pnpm check

      - name: '🏗️ build the site'
        run: pnpm build

      # The CV PDFs and the browser tests need a browser, and Playwright
      # downloads its own Chromium. The download is cached by the Playwright
      # version, which is what decides the build it fetches; the OS packages it
      # needs are installed every run, because apt is not cached and a cache
      # hit skips only the download.
      - name: '🔎 read the playwright version'
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: '💾 cache playwright browsers'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: '🌐 install chromium'
        run: pnpm exec playwright install --with-deps chromium

      - name: '📄 render the cv pdfs'
        run: pnpm render:pdf

      - name: '🔍 check the built site'
        run: pnpm check:dist

      # Contrast, themes, print, the phone viewport, and reduced motion, in a
      # browser against a static server of dist/.
      - name: '🧪 run the browser tests'
        run: pnpm test

      # Performance, accessibility, and best practices on the home and CV
      # pages in both languages, mobile profile, 90 or the run fails. Lighthouse
      # finds the Chrome the runner image ships; nothing points it there.
      - name: '🚦 run lighthouse'
        run: pnpm lighthouse

      # Adds a fixture project, rebuilds, and asserts it reaches every output
      # and nothing outside src/content/ changed. It rebuilds dist/ without the
      # PDFs, which is why it runs after everything that reads them.
      - name: '🧪 test the content mechanism'
        run: pnpm test:content
