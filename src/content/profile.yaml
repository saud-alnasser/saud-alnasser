# The person. The top-level key is the entry id.
profile:
  name:
    en: Saud Alnasser
    ar: سعود الناصر
  label:
    en: Software engineer
    ar: مهندس برمجيات
  # Two summaries, because there are two documents and they carry different
  # entries. Split on 2026-09-11, by Saud's decision, after one field had been
  # rewritten twice in a day trying to serve both:
  #
  #   summary        the CV, the home page hero, the README profile block,
  #                  and basics.summary in both resume.json documents
  #   resumeSummary  the resume, and nothing else
  #
  # The rule each one follows is the same: name nothing the document itself
  # does not print as an entry. That is what one field could not do. The CV
  # carries the whole record, the resume carries one project, and the
  # paragraph that named the resume's missing work was the paragraph the CV
  # had to open with too. The resume carried two until later the same day,
  # when Mudaraj left it by Saud's decision and `resumeSummary` lost the
  # sentence that named it.
  #
  # That rule is why `summary` lost a clause the same day: a statically typed
  # language on a bytecode virtual machine, in draft. That is Nova, and
  # nothing publishes it. src/content/projects/nova-lang.yaml is
  # `status: in-progress`, and isShown() in src/lib/shown.ts shows a project
  # only where its status is `completed`, so Nova reaches no page, no
  # document, and no JSON file. The clause was the only place it was named
  # anywhere, and a reader following it arrived at nothing. Do not restore it
  # on the grounds that the entry is in the source: when its status changes,
  # Nova reaches the home page and the CV on its own, the way every other
  # project gets there.
  #
  # Keeping them apart is the cost of the split, and it is the reason they sit
  # a few lines apart under one comment rather than in two files.
  #
  # Rewritten on 2026-09-24 at Saud's request, both of them: plainer, shorter,
  # opening on "Software engineer", and naming only work he built and learned
  # from, which is rentable. `summary` closes on the role he is looking for,
  # in his own words from his LinkedIn profile, pared down. The PL/0 compiler
  # and the Monkey interpreter stay on the site as projects and leave the
  # summary. So does cachescribe: no version on npm ships its built code, so
  # installing it has never given a working import.
  #
  # Length on the resume is measured, never assumed. Lengthening
  # `resumeSummary` means running `pnpm render:pdf` and reading the free
  # height at Letter against the floor in scripts/render-pdf.mjs; `summary`
  # has no budget, because the CV has no page count to hold.
  summary:
    en: >-
      Software engineer and computer science graduate in Riyadh, working
      mainly in TypeScript and Rust. Sole developer of rentable, a desktop app
      for tracking rent payments that works offline. Looking for a junior
      software engineering role building products people rely on, alongside
      an experienced team.
    ar: >-
      مهندس برمجيات وخريج علوم حاسب في الرياض، يعمل في الغالب بلغتي
      TypeScript وRust. المطور الوحيد لـ rentable، تطبيق لسطح المكتب لتتبع
      مدفوعات الإيجار يعمل دون اتصال. يتطلع إلى وظيفة مهندس برمجيات مبتدئ
      يبني فيها منتجات يعتمد عليها الناس، ضمن فريق ذي خبرة.
  resumeSummary:
    en: >-
      Software engineer and computer science graduate in Riyadh, working
      mainly in TypeScript and Rust. Sole developer of rentable, a desktop app
      for tracking rent payments that works offline.
    ar: >-
      مهندس برمجيات وخريج علوم حاسب في الرياض، يعمل في الغالب بلغتي
      TypeScript وRust. المطور الوحيد لـ rentable، تطبيق لسطح المكتب لتتبع
      مدفوعات الإيجار يعمل دون اتصال.
  email: saud4services@gmail.com
  nationality:
    en: Saudi
    ar: سعودي
  location:
    en: Riyadh, Saudi Arabia
    ar: الرياض، المملكة العربية السعودية
  # GitHub first: the home page's first action and the README, which is the
  # GitHub profile page itself, read the first entry as GitHub. Every other
  # profile is a line above the Portfolio link in the README's profile block.
  # The QR code on both documents is LinkedIn's, found by its network rather
  # than by its place in this list (src/lib/networks.ts), and it is the one
  # profile either document carries: since 2026-09-22 the contact line writes
  # no profile out, by Saud's decision, so GitHub is on neither document page
  # nor in any PDF and survives in both resume.json documents.
  profiles:
    - network: GitHub
      username: saud-alnasser
      url: https://github.com/saud-alnasser
    - network: LinkedIn
      username: saudalnasser
      url: https://www.linkedin.com/in/saudalnasser
